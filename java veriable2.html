<html>
    <head>
        <title>Java Variable</title>
    </head>
    <body>
        <h1>java variable</h1>
        <p id="DEMO"></p>
    <script>
        var x, y, z; // Declare variables
        x= 3; // Assign values
        y= 4;
        z= x + y;
        document.getElementById('DEMO').innerHTML = "The sum of x and y is: " + z;
    </script>
    </body>
</html>
